name: Build M1/M2 1.5 port

on:
  push:
    branches: [build/1.5.0-m1.0, feat/muse-glimmer-1.5]
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run tests after the active local session has concluded
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Build and package splash 1.5.0-m1.1-muse (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select newest Xcode and report tools
        run: |
          set -x
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun -sdk macosx metal --version || true
          xcrun -sdk macosx metallib --version || true

      - name: Download Metal toolchain component
        continue-on-error: true
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Build engine and metallib
        run: make -j4 PYTHON_CANDIDATES=python3

      - name: Checksum compiled engine
        working-directory: build
        run: shasum -a 256 splash splash.metallib > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: splash-1.5.0-m1.1-muse-engine-${{ matrix.runner }}
          path: |
            build/splash
            build/splash.metallib
            build/host-step.metallib
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Engine tests (CPU)
        run: make test-engine-cpu PYTHON_CANDIDATES=python3

      - name: Package runtime archive
        run: make package RELEASE_VERSION=1.5.0-m1.1-muse PYTHON_CANDIDATES=python3

      - name: Show artefacts
        run: ls -l dist && cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: splash-1.5.0-m1.1-muse-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
