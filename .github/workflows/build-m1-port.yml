name: Swift exactness-gated M2 experiments

on:
  workflow_dispatch:
    inputs:
      variants:
        description: JSON array of isolated native variants
        required: true
        type: string
        default: '["baseline","gateup","af5exact"]'

permissions:
  contents: read

jobs:
  package:
    name: Swift ${{ matrix.variant }} (Apple7/8, xcode-27)
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select independent experimental change
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          git checkout d0056d208b591776e3d76f32819b27ba358a0722 -- \
            runtime/ops/LinearGguf.cpp \
            runtime/metal/kernels/decode/linear_gguf_sgmatrix.metal
          case "$VARIANT" in
            baseline) ;;
            gateup) git checkout "$GITHUB_SHA" -- runtime/ops/LinearGguf.cpp ;;
            af5exact) git checkout "$GITHUB_SHA" -- runtime/metal/kernels/decode/linear_gguf_sgmatrix.metal ;;
            *) echo "Unsupported variant: $VARIANT" >&2; exit 2 ;;
          esac
          printf '%s\n' "$GITHUB_SHA" "$VARIANT"
          shasum -a 256 runtime/ops/LinearGguf.cpp \
            runtime/metal/kernels/decode/linear_gguf_sgmatrix.metal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select newest Xcode and report tools
        run: |
          set -x
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun -sdk macosx metal --version || true
          xcrun -sdk macosx metallib --version || true

      - name: Download Metal toolchain component
        continue-on-error: true
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Build engine and existing parity tools
        run: |
          make -j4 PYTHON_CANDIDATES=python3 \
            all build/engine-tests/decode-profile \
            build/engine-tests/backend-benchmark \
            build/engine-tests/teacher-logits \
            build/engine-tests/weight-digests \
            build/engine-tests/gguf-projection \
            build/engine-tests/gguf-projection-benchmark \
            build/engine-tests/linear-plan \
            build/engine-tests/production-and-test.metallib

      - name: Engine tests (CPU)
        run: make test-engine-cpu PYTHON_CANDIDATES=python3

      - name: Checksum native experiment
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          printf '%s\n' "$GITHUB_SHA" "$VARIANT" > build/VARIANT
          shasum -a 256 build/splash build/splash.metallib \
            build/host-step.metallib \
            build/engine-tests/decode-profile \
            build/engine-tests/backend-benchmark \
            build/engine-tests/teacher-logits \
            build/engine-tests/weight-digests \
            build/engine-tests/gguf-projection \
            build/engine-tests/gguf-projection-benchmark \
            build/engine-tests/linear-plan \
            build/engine-tests/production-and-test.metallib > build/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: swift-perf-${{ matrix.variant }}
          path: |
            build/splash
            build/splash.metallib
            build/host-step.metallib
            build/SHA256SUMS
            build/VARIANT
            build/engine-tests/decode-profile
            build/engine-tests/backend-benchmark
            build/engine-tests/teacher-logits
            build/engine-tests/weight-digests
            build/engine-tests/gguf-projection
            build/engine-tests/gguf-projection-benchmark
            build/engine-tests/linear-plan
            build/engine-tests/production-and-test.metallib
          if-no-files-found: error
          retention-days: 7

